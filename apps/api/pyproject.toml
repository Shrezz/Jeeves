[project]
name = "claim-companion-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pypdf>=6,<7",
  "tiktoken>=0.9,<1",
  "langgraph>=1.2.20,<2",
  "langchain-core>=1.7,<2",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "langfuse>=4,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
