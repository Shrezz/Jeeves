name: API tests and coverage

on:
  push:
    paths: ['apps/api/**', 'evals/**', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['apps/api/**', 'evals/**', '.github/workflows/api-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv and locked API dependencies
        run: |
          python -m pip install uv
          uv sync --locked --group dev
      - name: Run API tests with statement and branch coverage
        run: uv run --locked pytest -q tests --ignore=tests/database --cov=app --cov-branch --cov-report=term --cov-report=xml:coverage.xml
      - name: Retain coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          if-no-files-found: warn
